# ────────────────────────────────────────────────────────────────────
# Deploy to STAGING (reusable + manual)
# ────────────────────────────────────────────────────────────────────
# Called by Build and Publish after a successful main build, or
# manually via workflow_dispatch.
# Secrets come from GitHub Environment "staging".
# ────────────────────────────────────────────────────────────────────

name: Deploy Staging

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Immutable image tag (git short SHA)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (git short SHA) to deploy"
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_PUBLIC_URL }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deploy assets
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for v in SSH_HOST SSH_USER SSH_KEY DB_PASSWORD JWT_SECRET; do
            if [[ -z "${!v}" ]]; then
              echo "::error::Missing required secret: $v (Environment: staging)"
              missing=1
            fi
          done
          exit $missing

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [[ -n "${SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_SSH_KNOWN_HOSTS not set — using ssh-keyscan (TOFU). Prefer pinning known_hosts in staging."
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Materialize remote env file (secrets not on process argv)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL || 'http://localhost:8088' }}
          BOOTSTRAP_ADMIN_ENABLED: ${{ secrets.BOOTSTRAP_ADMIN_ENABLED || 'false' }}
          BOOTSTRAP_ADMIN_USERNAME: ${{ secrets.BOOTSTRAP_ADMIN_USERNAME || 'admin' }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          {
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}"
            echo "STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}"
            echo "FRONTEND_URL=${FRONTEND_URL}"
            echo "BOOTSTRAP_ADMIN_ENABLED=${BOOTSTRAP_ADMIN_ENABLED}"
            echo "BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME}"
            echo "BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}"
            echo "BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}"
            echo "ASPNETCORE_ENVIRONMENT=Staging"
            echo "SEED_DEMO_DATA=true"
            echo "ALLOW_DEMO_OUTSIDE_DEV=true"
          } > /tmp/deploy.env

      - name: Upload compose, script, and env to host
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/healthcare-staging' }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes)
          SCP=(scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes)
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}/scripts'"
          "${SCP[@]}" docker-compose.staging.yml "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.staging.yml"
          "${SCP[@]}" scripts/remote-deploy.sh "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/scripts/remote-deploy.sh"
          "${SCP[@]}" /tmp/deploy.env "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.env.deploy"
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "chmod 600 '${DEPLOY_PATH}/.env.deploy' && chmod 700 '${DEPLOY_PATH}/scripts/remote-deploy.sh'"
          shred -u /tmp/deploy.env 2>/dev/null || rm -f /tmp/deploy.env

      - name: Login to GHCR on remote and deploy
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/healthcare-staging' }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USER || github.actor }}
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL || 'http://127.0.0.1:8081/health' }}
        run: |
          set -euo pipefail
          API_IMAGE="${IMAGE_API}:${IMAGE_TAG}"
          FRONTEND_IMAGE="${IMAGE_FRONTEND}:${IMAGE_TAG}"
          echo "Deploying API=$API_IMAGE FRONTEND=$FRONTEND_IMAGE"

          # Pass token via remote stdin to avoid shell history retention where possible
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "set -euo pipefail
             cd '${DEPLOY_PATH}'
             echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
             export API_IMAGE='${API_IMAGE}' FRONTEND_IMAGE='${FRONTEND_IMAGE}'
             export COMPOSE_FILE=docker-compose.staging.yml
             export ENV_FILE=.env.deploy
             export HEALTH_URL='${HEALTH_URL}'
             export HEALTH_RETRIES=36
             export HEALTH_INTERVAL_SEC=5
             bash ./scripts/remote-deploy.sh
             docker logout ghcr.io || true
            "

      - name: Cleanup local SSH key
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
