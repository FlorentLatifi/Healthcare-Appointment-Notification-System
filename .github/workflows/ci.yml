# ────────────────────────────────────────────────────────────────────
# Continuous Integration
# ────────────────────────────────────────────────────────────────────
# Runs on every pull request and push to main.
# Does NOT build or push images, and does NOT deploy.
#
#   architecture-tests → unit-tests → integration-tests
#   frontend (parallel)
# ────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture-tests:
    runs-on: ubuntu-latest
    name: Architecture governance (NetArchTest)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln

      - name: Build (Release)
        run: dotnet build Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln --no-restore -c Release

      - name: Run Architecture Tests
        run: >
          dotnet test Healthcare.AppointmentSystem/Healthcare.ArchitectureTests/Healthcare.ArchitectureTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=architecture-test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload architecture test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-results
          path: "**/architecture-test-results.trx"
          retention-days: 14

  unit-tests:
    runs-on: ubuntu-latest
    needs: architecture-tests
    name: Unit tests + NuGet audit
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln

      - name: Check formatting
        run: dotnet format Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln --verify-no-changes

      - name: Build (Release)
        run: dotnet build Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln --no-restore -c Release

      # Category=Integration in UnitTests is excluded (EF/SQLite concurrency suites that are opt-in).
      # Profile-link identity regressions live in Healthcare.IntegrationTests (not UnitTests) so
      # --filter Category!=Integration cannot skip them — Moq alone cannot catch PatientId=0.
      - name: Run unit tests
        run: >
          dotnet test Healthcare.AppointmentSystem/Healthcare.UnitTests/Healthcare.UnitTests.csproj
          --no-build -c Release
          --filter Category!=Integration
          --logger "trx;LogFileName=unit-test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: NuGet vulnerability audit
        run: |
          set -euo pipefail
          output=$(dotnet list package --vulnerable --include-transitive \
            Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln 2>&1) || true
          echo "$output"
          if echo "$output" | grep -Eqi "Critical|High"; then
            echo "::error::High or Critical NuGet vulnerabilities found"
            exit 1
          fi
          if echo "$output" | grep -Eqi "Moderate"; then
            echo "::warning::Moderate NuGet vulnerabilities present — review required"
          fi

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/unit-test-results.trx"
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/coverage.cobertura.xml"
          retention-days: 14

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    name: Integration tests (Testcontainers)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln

      - name: Build (Release)
        run: dotnet build Healthcare.AppointmentSystem/Healthcare.AppointmentSystem.sln --no-restore -c Release

      # Profile-link identity regressions (SQLite EF; no Testcontainers). Must stay in this project:
      # UnitTests uses --filter Category!=Integration, which previously hid these when they lived
      # there with Category=Integration. Moq cannot catch PatientId=0 — keep this step CI-gated.
      - name: Profile identity regression (CreateProfileLinkIdentity)
        run: >
          dotnet test Healthcare.AppointmentSystem/Healthcare.IntegrationTests/Healthcare.IntegrationTests.csproj
          --no-build -c Release
          --filter "FullyQualifiedName~CreateProfileLinkIdentity"
          --logger "trx;LogFileName=identity-regression-results.trx"
          --logger "console;verbosity=normal"

      - name: Run integration tests
        run: >
          dotnet test Healthcare.AppointmentSystem/Healthcare.IntegrationTests/Healthcare.IntegrationTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=integration-test-results.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/integration-test-results.trx"
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    name: Frontend lint, test, build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: healthcare-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: healthcare-frontend

      - name: Lint
        run: npm run lint
        working-directory: healthcare-frontend

      - name: Test
        run: npm run test
        working-directory: healthcare-frontend

      - name: Build
        run: npm run build
        working-directory: healthcare-frontend

  ci-success:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [integration-tests, frontend]
    if: always()
    steps:
      - name: Require green jobs
        run: |
          if [[ "${{ needs.integration-tests.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "CI failed (integration=${{ needs.integration-tests.result }}, frontend=${{ needs.frontend.result }})"
            exit 1
          fi
          echo "CI passed"
