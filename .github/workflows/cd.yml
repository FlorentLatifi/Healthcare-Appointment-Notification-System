name: CD — Build Images & Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API image ──────────────────────────────────────────────
      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=sha,prefix=,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: Healthcare.AppointmentSystem
          file: Healthcare.AppointmentSystem/Healthcare.Presentation.API/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend image ─────────────────────────────────────────
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: healthcare-frontend
          build-args: |
            VITE_API_BASE_URL=/api/v1
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deployment (placeholder) ───────────────────────────────────
  # Assumption: the target is a single VM running Docker Compose.
  # Adapt SSH_HOST / SSH_USER / DEPLOY_PATH to your infrastructure.
  # Install steps once on the target:
  #   git clone https://github.com/${{ github.repository }} /opt/healthcare
  #   cd /opt/healthcare && docker compose -f docker-compose.prod.yml up -d
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH + Docker Compose
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/healthcare' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          echo "Deploying to $SSH_USER@$SSH_HOST:$DEPLOY_PATH ..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Inline env vars so they're available to docker compose on the remote host
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "$SSH_USER@$SSH_HOST" \
              "cd $DEPLOY_PATH && \
               DB_PASSWORD='$DB_PASSWORD' \
               JWT_SECRET='$JWT_SECRET' \
               STRIPE_SECRET_KEY='$STRIPE_SECRET_KEY' \
               STRIPE_PUBLISHABLE_KEY='$STRIPE_PUBLISHABLE_KEY' \
               docker compose -f docker-compose.prod.yml pull && \
               DB_PASSWORD='$DB_PASSWORD' \
               JWT_SECRET='$JWT_SECRET' \
               STRIPE_SECRET_KEY='$STRIPE_SECRET_KEY' \
               STRIPE_PUBLISHABLE_KEY='$STRIPE_PUBLISHABLE_KEY' \
               docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
               docker image prune -f"
          echo "Deployment complete."
