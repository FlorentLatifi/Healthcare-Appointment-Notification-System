services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/florentlatifi/healthcare-appointment-notification-system/api:${API_TAG:-latest}
    pull_policy: always
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HealthcareDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: "HealthcareAPI"
      Jwt__Audience: "HealthcareClients"
      Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=5000,syncTimeout=5000"
      Redis__InstanceName: "HealthcareApp:"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped

  frontend:
    image: ghcr.io/florentlatifi/healthcare-appointment-notification-system/frontend:${FRONTEND_TAG:-latest}
    pull_policy: always
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
  api_logs:
