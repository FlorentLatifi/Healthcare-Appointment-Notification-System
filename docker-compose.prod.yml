# ═══════════════════════════════════════════════════════════════════
# Production stack (default for CI/CD)
# ═══════════════════════════════════════════════════════════════════
# Secrets:  .env.secrets   (mode 600, never commit)
# Config:   config/production.env (non-secret, in git)
# Images:   API_IMAGE / FRONTEND_IMAGE (immutable tags)
#
#   docker compose --env-file .env.secrets --env-file config/production.env \
#     -f docker-compose.prod.yml up -d
#
# Optional file-based Docker secrets:
#   docker-compose.prod.with-file-secrets.yml
# Full strategy: docs/secrets-management.md
# ═══════════════════════════════════════════════════════════════════

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env.secrets}
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: always
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ${CONFIG_ENV_FILE:-./config/production.env}
        required: false
      - path: ${SECRETS_ENV_FILE:-./.env.secrets}
        required: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HealthcareDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required in .env.secrets}
      Jwt__Issuer: ${Jwt__Issuer:-HealthcareAPI}
      Jwt__Audience: ${Jwt__Audience:-HealthcareClients}
      Redis__ConnectionString: ${Redis__ConnectionString:-redis:6379,abortConnect=false,connectTimeout=5000,syncTimeout=5000}
      Redis__InstanceName: ${Redis__InstanceName:-HealthcareApp:Prod:}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      TrustedNetworks__0: ${TrustedNetworks__0:-172.16.0.0/12}
      AllowedOrigins__0: ${FRONTEND_URL:-http://localhost}
      Seeding__SeedDemoData: "false"
      Seeding__AllowDemoDataOutsideDevelopment: "false"
      Seeding__BootstrapAdmin__Enabled: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      Seeding__BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      Seeding__BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Seeding__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  sqlserver_data:
  api_logs:
