services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # No host ports — SQL is only reachable on the compose network (not public internet).
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host ports — Redis is internal to the compose network only.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/florentlatifi/healthcare-appointment-notification-system/api:${API_TAG:-latest}
    pull_policy: always
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HealthcareDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: "HealthcareAPI"
      Jwt__Audience: "HealthcareClients"
      Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=5000,syncTimeout=5000"
      Redis__InstanceName: "HealthcareApp:"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      # Trust the Docker bridge network so ForwardedHeadersMiddleware reads
      # the real client IP from X-Forwarded-For sent by nginx. Without this,
      # rate limiting buckets all users behind the proxy into one global bucket.
      TrustedNetworks__0: 172.16.0.0/12
      AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:5173}
      # Never seed demo data in production. Bootstrap first admin only via secrets.
      Seeding__SeedDemoData: "false"
      Seeding__AllowDemoDataOutsideDevelopment: "false"
      Seeding__BootstrapAdmin__Enabled: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      Seeding__BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      Seeding__BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Seeding__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - api_logs:/app/logs
    restart: unless-stopped

  frontend:
    image: ghcr.io/florentlatifi/healthcare-appointment-notification-system/frontend:${FRONTEND_TAG:-latest}
    pull_policy: always
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
  api_logs:
