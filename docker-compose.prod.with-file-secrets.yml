# Production variant using Docker secret files under ./secrets/ (mode 0400).
# Requires files created by scripts/generate-secrets.sh.
# API entrypoint maps /run/secrets/* → Jwt__Secret, Stripe__*, etc.
#
#   # still need .env.secrets for SQL Server (official image has no *_FILE for SA)
#   docker compose --env-file .env.secrets --env-file config/production.env \
#     -f docker-compose.prod.with-file-secrets.yml up -d

include:
  - path: docker-compose.prod.yml

services:
  api:
    secrets:
      - jwt_secret
      - db_password
      - stripe_secret_key
      - stripe_webhook_secret
      - stripe_publishable_key

secrets:
  jwt_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_secret
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password
  stripe_secret_key:
    file: ${SECRETS_DIR:-./secrets}/stripe_secret_key
  stripe_webhook_secret:
    file: ${SECRETS_DIR:-./secrets}/stripe_webhook_secret
  stripe_publishable_key:
    file: ${SECRETS_DIR:-./secrets}/stripe_publishable_key
