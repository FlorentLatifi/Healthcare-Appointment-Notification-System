# Staging stack — isolated from production (ports, Redis prefix, optional demo seed).
# Secrets via .env.deploy. Images: API_IMAGE / FRONTEND_IMAGE (immutable tags).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    expose:
      - "1433"
    volumes:
      - sqlserver_data_staging:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: always
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HealthcareDb_Staging;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=true;MultipleActiveResultSets=true"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__Issuer: "HealthcareAPI"
      Jwt__Audience: "HealthcareClients"
      Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=5000,syncTimeout=5000"
      Redis__InstanceName: "HealthcareApp:Staging:"
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY}
      TrustedNetworks__0: 172.16.0.0/12
      AllowedOrigins__0: ${FRONTEND_URL:-http://localhost}
      # Staging may seed demo data if explicitly enabled via env file
      Seeding__SeedDemoData: ${SEED_DEMO_DATA:-true}
      Seeding__AllowDemoDataOutsideDevelopment: ${ALLOW_DEMO_OUTSIDE_DEV:-true}
      Seeding__BootstrapAdmin__Enabled: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      Seeding__BootstrapAdmin__Username: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      Seeding__BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Seeding__BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      # Distinct from production 8080 so both can run on one host if needed
      - "8081:8080"
    volumes:
      - api_logs_staging:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  sqlserver_data_staging:
  api_logs_staging:
